<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1119"/>
      <stop offset="100%" stop-color="#5a2f30"/>
    </linearGradient>
    <filter id="blend" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="75"/>
    </filter>
  </defs>
  <!-- safety base so edges are never transparent -->
  <rect width="600" height="400" fill="url(#base)"/>
  <!-- colour blobs, heavily blurred into a smooth blended gradient -->
  <g filter="url(#blend)">
    <rect x="-170" y="-120" width="940" height="640" fill="url(#base)"/>
    <circle cx="120" cy="70" r="250" fill="#8a534c"/>
    <ellipse cx="350" cy="210" rx="300" ry="190" fill="#6e3c3c"/>
    <circle cx="520" cy="330" r="240" fill="#b87c70"/>
    <circle cx="560" cy="60" r="170" fill="#7a4848"/>
    <circle cx="60" cy="380" r="200" fill="#241019"/>
  </g>
</svg>
