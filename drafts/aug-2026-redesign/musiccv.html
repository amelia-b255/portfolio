<!-- iOS paints the strip behind the status bar from theme-color; without it
     Safari uses the page background and a cream band sits above the banner.
     Kept in sync with the banner colour when the theme is toggled. -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<script>
/* Theme carries across page navigation, but a refresh resets to light.
   Runs before first paint so there is no flash of the wrong mode. */
(function(){try{
  var nav=(performance.getEntriesByType('navigation')[0]||{}).type;
  if(nav==='reload'){ sessionStorage.removeItem('rd-theme'); }
  else if(sessionStorage.getItem('rd-theme')==='dark'){ document.documentElement.classList.add('dark'); }
}catch(e){}})();

/* Device tier. An iPad with a trackpad reports hover:hover and 1366px wide, so
   neither width nor the hover query can identify it — maxTouchPoints can.
   Sets html.touch (and html.tablet ≥601px) before first paint. */
(function(){try{
  var d=document.documentElement;
  var t=(navigator.maxTouchPoints||0)>1
     || (window.matchMedia&&matchMedia('(hover: none) and (pointer: coarse)').matches);
  window.RD_TOUCH=t;
  if(t){ d.classList.add('touch'); if(window.innerWidth>600) d.classList.add('tablet'); }
}catch(e){}})();

/* keep the status-bar strip the same colour as the banner */
(function(){try{
  function sync(){
    var b=document.querySelector('.microbar'); if(!b) return;
    var m=document.querySelector('meta[name="theme-color"]');
    if(!m){ m=document.createElement('meta'); m.name='theme-color'; document.head.appendChild(m); }
    /* the banner is a gradient, so backgroundColor reads transparent — take
       the token the gradient is built from instead */
    var c=getComputedStyle(document.documentElement).getPropertyValue('--red').trim()
       || getComputedStyle(b).backgroundColor;
    if(c && c!=='rgba(0, 0, 0, 0)') m.setAttribute('content',c);
  }
  window.RD_SYNC_BAR=sync;
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',sync);
  else sync();
}catch(e){}})();
</script>
