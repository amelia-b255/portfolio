// ===== Tool Switching =====
function setActiveTool(toolName) {
  currentTool = toolName;

  // Close all picker panels when switching to any tool
  document.getElementById('stickerPanel')?.classList.remove('open');
  document.getElementById('shapePanel')?.classList.remove('open');
  document.getElementById('typePanel')?.classList.remove('open');
  if (toolName !== 'type') {
    if (textInputActive && typeof commitText === 'function' && textInputArea?.value.trim()) {
      commitText();
    } else if (typeof hideTextBox === 'function') {
      hideTextBox();
    }
  }

  // Enable sticker layer pointer events in select + bucket modes
  document.getElementById('stickerLayer')?.classList.toggle('select-active', toolName === 'select' || toolName === 'bucket');

  // Deselect any sticker + commit canvas selection when leaving select tool
  if (toolName !== 'select') {
    if (typeof deselectSticker === 'function') deselectSticker();
    if (typeof commitCanvasSel === 'function') commitCanvasSel();
  }

  // Update button visuals
  document.querySelectorAll('.tool-btn').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.tool === toolName);
  });

  // Update cursor based on tool
  const drawingTools = ['brush', 'special-pen'];
  // Use icon cursor for all tools that have a config; hide native cursor
  if (TOOL_CURSOR_CONFIG[toolName]) {
    canvas.style.cursor = 'none';
    document.getElementById('stickerLayer').style.cursor = 'none';
  } else {
    canvas.style.cursor = 'crosshair';
    document.getElementById('stickerLayer').style.cursor = '';
    brushCursor.classList.remove('visible');
  }
}

document.querySelectorAll('.tool-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    const tool = btn.dataset.tool;
    if (tool === 'mail' || tool === 'shape') {
      // Toggle sticker picker panel; close other panels; don't change drawing tool
      document.getElementById('shapePanel')?.classList.remove('open');
      document.getElementById('typePanel')?.classList.remove('open');
      const panel = document.getElementById('stickerPanel');
      if (panel) {
        panel.classList.toggle('open');
        btn.classList.toggle('active', panel.classList.contains('open'));
      }
    } else if (tool === 'fill') {
      // Toggle shape picker panel; close other panels; don't change drawing tool
      document.getElementById('stickerPanel')?.classList.remove('open');
      document.getElementById('typePanel')?.classList.remove('open');
      const panel = document.getElementById('shapePanel');
      if (panel) {
        panel.classList.toggle('open');
        btn.classList.toggle('active', panel.classList.contains('open'));
      }
    } else if (tool === 'type') {
      // Toggle font picker panel; close other panels; activate type tool
      document.getElementById('stickerPanel')?.classList.remove('open');
      document.getElementById('shapePanel')?.classList.remove('open');
      setActiveTool('type');
      const panel = document.getElementById('typePanel');
      if (panel) {
        panel.classList.toggle('open');
        btn.classList.toggle('active', panel.classList.contains('open') || currentTool === 'type');
      }
    } else {
      setActiveTool(tool);
    }
  });
});

// Keyboard shortcuts for undo/redo
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'z') {
    e.preventDefault();
    if (e.shiftKey) {
      redo();
    } else {
      undo();
    }
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'y') {
    e.preventDefault();
    redo();
  }
  // Delete/Backspace removes whatever is selected — sticker, shape, text,
  // or a lifted piece of the drawing (not while typing in a text box)
  if ((e.key === 'Delete' || e.key === 'Backspace') && (selectedSticker || canvasSel)) {
    const t = e.target;
    if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' || t.isContentEditable)) return;
    e.preventDefault();
    if (selectedSticker) deleteSelectedSticker();
    else discardCanvasSel();
  }
});

function deleteSelectedSticker() {
  const s = selectedSticker;
  if (!s) return;
  saveCanvasState();
  deselectSticker();
  s.el.remove();
  const i = stickerList.indexOf(s);
  if (i !== -1) stickerList.splice(i, 1);
}

// ===== Sticker System =====
const STICKERS_LIST = [
  'orchid-pink', 'orchid-red', 'orchid-purple', 'cake', 'ice-cream',
  'strawberry', 'teacup', 'olives', 'girl', 'koi-silver', 'koi-pair',
  'fish-orange', 'cat', 'envelope', 'star-pink', 'star-silver',
  'star-blue', 'art-red', 'art-white',
];

// select-frame.webp measurement constants (from pixel analysis of 4500×4500 PNG):
// Non-transparent bounds: x=1019..3480, y=1312..3187
// So left/right padding = 22.6%, top/bottom padding = 29.2%
const SF_PAD_X  = 0.226; // fraction of PNG width that is left or right padding
const SF_PAD_Y  = 0.292; // fraction of PNG height that is top or bottom padding
const SF_W_FRAC = 1 - 2 * SF_PAD_X; // 0.548 — frame inner width / PNG width
const SF_H_FRAC = 1 - 2 * SF_PAD_Y; // 0.416 — frame inner height / PNG height
const SF_INSET  = 10; // px of breathing room between sticker edge and frame rectangle

let stickerList = [];
let selectedSticker = null;
let stickerIdCounter = 0;
let stickerDragState = null;
const MIN_STICKER_PX = 30;

const stickerLayer = document.getElementById('stickerLayer');
const selectFrame  = document.getElementById('selectFrame');
const stickerPanel = document.getElementById('stickerPanel');
const stickerGrid  = document.getElementById('stickerGrid');

// Switch to the normal arrow cursor whenever the sticker or shape menu is open
const pickerCursorObserver = new MutationObserver(() => {
  const open = isStickerMenuOpen();
  document.body.classList.toggle('sticker-menu-open', open);
  if (open) brushCursor.classList.remove('visible');
});
pickerCursorObserver.observe(stickerPanel, { attributes: true, attributeFilter: ['class'] });
pickerCursorObserver.observe(document.getElementById('shapePanel'), { attributes: true, attributeFilter: ['class'] });

// ===== Canvas Selection State =====
let canvasSel = null; // { x, y, w, h } in stickerLayer CSS px
let canvasSelDragState = null;

// Content element lives inside stickerLayer (inherits pointer-events from parent)
const canvasSelContent = document.createElement('div');
canvasSelContent.id = 'canvasSelContent';
const canvasSelInner = document.createElement('canvas');
canvasSelInner.id = 'canvasSelInner';
canvasSelContent.appendChild(canvasSelInner);
stickerLayer.appendChild(canvasSelContent);

// Drag canvasSelContent to move
canvasSelContent.addEventListener('mousedown', (e) => {
  if (currentTool !== 'select' || !canvasSel) return;
  e.stopPropagation();
  deselectSticker();
  canvasSelDragState = {
    type: 'move',
    startMouseX: e.clientX, startMouseY: e.clientY,
    startX: canvasSel.x, startY: canvasSel.y,
  };
});

function updateCanvasSelEl() {
  if (!canvasSel) { canvasSelContent.style.display = 'none'; return; }
  canvasSelContent.style.display = 'block';
  canvasSelContent.style.left    = canvasSel.x + 'px';
  canvasSelContent.style.top     = canvasSel.y + 'px';
  canvasSelContent.style.width   = canvasSel.w + 'px';
  canvasSelContent.style.height  = canvasSel.h + 'px';
  canvasSelInner.style.width     = canvasSel.w + 'px';
  canvasSelInner.style.height    = canvasSel.h + 'px';
}

function positionSelFrame() {
  if (!canvasSel) { selectFrame.style.display = 'none'; return; }
  const appEl    = document.querySelector('.app');
  const appRect  = appEl.getBoundingClientRect();
  const layerRect = stickerLayer.getBoundingClientRect();
  const ox = layerRect.left - appRect.left;
  const oy = layerRect.top  - appRect.top;

  const cx   = ox + canvasSel.x + canvasSel.w / 2;
  const cy   = oy + canvasSel.y + canvasSel.h / 2;
  const P    = SF_INSET;
  const elW  = canvasSel.w + 2 * P;
  const elH  = canvasSel.h + 2 * P;
  const elLeft = cx - canvasSel.w / 2 - P;
  const elTop  = cy - canvasSel.h / 2 - P;

  selectFrame.style.display = 'block';
  selectFrame.style.left    = elLeft + 'px';
  selectFrame.style.top     = elTop  + 'px';
  selectFrame.style.width   = elW    + 'px';
  selectFrame.style.height  = elH    + 'px';

  const handles = {
    tl: [0,     0],
    tr: [elW,   0],
    bl: [0,     elH],
    br: [elW,   elH],
    t:  [elW/2, 0],
    b:  [elW/2, elH],
    l:  [0,     elH/2],
    r:  [elW,   elH/2],
  };
  selectFrame.querySelectorAll('.rh').forEach((h) => {
    const [hx, hy] = handles[h.dataset.dir];
    h.style.left = hx + 'px';
    h.style.top  = hy + 'px';
  });
}

function captureCanvasSel(x, y, w, h) {
  const dpr = window.devicePixelRatio || 1;
  saveCanvasState();

  canvasSelInner.width  = Math.round(w * dpr);
  canvasSelInner.height = Math.round(h * dpr);
  const tc = canvasSelInner.getContext('2d');
  tc.clearRect(0, 0, canvasSelInner.width, canvasSelInner.height);
  // Copy from rawCanvas (pixel coords)
  tc.drawImage(rawCanvas, Math.round(x * dpr), Math.round(y * dpr),
    Math.round(w * dpr), Math.round(h * dpr), 0, 0, canvasSelInner.width, canvasSelInner.height);

  // Erase area from rawCanvas
  rawCtx.save();
  rawCtx.globalCompositeOperation = 'destination-out';
  rawCtx.fillStyle = 'rgba(0,0,0,1)';
  rawCtx.fillRect(x, y, w, h);
  rawCtx.restore();
  renderStyledCanvas();

  canvasSel = { x, y, w, h };
  stickerLayer.appendChild(canvasSelContent); // bring to DOM front (above all stickers)
  updateCanvasSelEl();
  positionSelFrame();
}

function commitCanvasSel() {
  if (!canvasSel) return;
  const dpr = window.devicePixelRatio || 1;

  // Create a new stroke canvas at the selection's current position (push to end = front)
  const newSC = document.createElement('canvas');
  newSC.width = rawCanvas.width;
  newSC.height = rawCanvas.height;
  newSC.getContext('2d').drawImage(
    canvasSelInner, 0, 0, canvasSelInner.width, canvasSelInner.height,
    Math.round(canvasSel.x * dpr), Math.round(canvasSel.y * dpr),
    Math.round(canvasSel.w * dpr), Math.round(canvasSel.h * dpr)
  );
  const selX = Math.max(0, Math.round(canvasSel.x * dpr) - 2);
  const selY = Math.max(0, Math.round(canvasSel.y * dpr) - 2);
  const selW = Math.min(rawCanvas.width,  Math.round((canvasSel.x + canvasSel.w) * dpr) + 2) - selX;
  const selH = Math.min(rawCanvas.height, Math.round((canvasSel.y + canvasSel.h) * dpr) + 2) - selY;
  strokeList.push({
    id: ++strokeIdCounter,
    canvas: newSC,
    isStatic: !!canvasSel.staticInfo,
    color: canvasSel.staticInfo ? canvasSel.staticInfo.color : null,
    staticBBox: selW > 0 && selH > 0 ? { x: selX, y: selY, w: selW, h: selH } : undefined,
    isSticker: !!canvasSel.fromSticker,
  });
  buildRawCanvas();

  canvasSel = null;
  canvasSelDragState = null;
  canvasSelContent.style.display = 'none';
  selectFrame.style.display = 'none';
}

// Throw away a lifted canvas selection without committing it back.
// The lift already saved pre-lift state, so one undo brings the piece back.
function discardCanvasSel() {
  if (!canvasSel) return;
  canvasSel = null;
  canvasSelDragState = null;
  canvasSelContent.style.display = 'none';
  selectFrame.style.display = 'none';
  buildRawCanvas();
}

function positionSelectFrame() {
  if (!selectedSticker) { selectFrame.style.display = 'none'; return; }
  const s   = selectedSticker;
  const P   = SF_INSET;
  const elW = s.w + 2 * P;
  const elH = s.h + 2 * P;

  const appEl    = document.querySelector('.app');
  const appRect  = appEl.getBoundingClientRect();
  const layerRect = stickerLayer.getBoundingClientRect();
  const appCX = (layerRect.left - appRect.left) + s.cx;
  const appCY = (layerRect.top  - appRect.top)  + s.cy;

  const elLeft = appCX - s.w / 2 - P;
  const elTop  = appCY - s.h / 2 - P;

  selectFrame.style.display = 'block';
  selectFrame.style.left    = elLeft + 'px';
  selectFrame.style.top     = elTop  + 'px';
  selectFrame.style.width   = elW    + 'px';
  selectFrame.style.height  = elH    + 'px';

  const handles = {
    tl: [0,     0],
    tr: [elW,   0],
    bl: [0,     elH],
    br: [elW,   elH],
    t:  [elW/2, 0],
    b:  [elW/2, elH],
    l:  [0,     elH/2],
    r:  [elW,   elH/2],
  };
  selectFrame.querySelectorAll('.rh').forEach((h) => {
    const [hx, hy] = handles[h.dataset.dir];
    h.style.left = hx + 'px';
    h.style.top  = hy + 'px';
  });
}

function selectStickerEl(sticker) {
  if (canvasSel) commitCanvasSel();
  if (selectedSticker) selectedSticker.el.classList.remove('selected');
  selectedSticker = sticker || null;
  if (selectedSticker) {
    selectedSticker.el.classList.add('selected');
    stickerLayer.appendChild(selectedSticker.el); // bring to front
  }
  positionSelectFrame();
}

function deselectSticker() {
  if (selectedSticker) selectedSticker.el.classList.remove('selected');
  selectedSticker = null;
  // Don't hide frame if a canvas selection is active
  if (!canvasSel) selectFrame.style.display = 'none';
}

function addSticker(src, cx, cy, w, h, isShape = false) {
  const id = ++stickerIdCounter;
  const el = document.createElement('div');
  el.className = 'sticker';
  el.style.left   = cx + 'px';
  el.style.top    = cy + 'px';
  el.style.width  = w  + 'px';
  el.style.height = h  + 'px';

  const img = document.createElement('img');
  img.src = src;
  img.alt = '';
  img.draggable = false;
  if (isShape) img.style.objectFit = 'fill';
  el.appendChild(img);
  stickerLayer.appendChild(el);

  const sticker = { id, src, cx, cy, w, h, el, isShape };
  stickerList.push(sticker);

  el.addEventListener('mousedown', (e) => {
    if (currentTool === 'select') {
      e.stopPropagation();
      e.preventDefault();
      saveCanvasState();
      selectStickerEl(sticker);
      stickerDragState = {
        type: 'move',
        startMouseX: e.clientX,
        startMouseY: e.clientY,
        startCX: sticker.cx,
        startCY: sticker.cy,
      };
      el.classList.add('dragging');
    } else if (currentTool === 'bucket' && sticker.isShape) {
      e.stopPropagation();
      e.preventDefault();
      saveCanvasState();
      fillShape(sticker);
    } else if (currentTool === 'bucket' && sticker.text) {
      e.stopPropagation();
      e.preventDefault();
      if (!currentColor || currentColor === sticker.text.color) return;
      saveCanvasState();
      sticker.text.color = currentColor;
      refreshTextSticker(sticker, true);
    }
  });

  return sticker;
}

// Resize handle mousedown
selectFrame.querySelectorAll('.rh').forEach((h) => {
  h.addEventListener('mousedown', (e) => {
    if (!selectedSticker && !canvasSel) return;
    e.stopPropagation();
    e.preventDefault();

    const dir = h.dataset.dir;
    const appEl    = document.querySelector('.app');
    const appRect   = appEl.getBoundingClientRect();
    const layerRect = stickerLayer.getBoundingClientRect();
    const ox = layerRect.left - appRect.left;
    const oy = layerRect.top  - appRect.top;

    if (selectedSticker) {
      saveCanvasState();
      const s = selectedSticker;
      const appCX = ox + s.cx;
      const appCY = oy + s.cy;
      const P = SF_INSET;
      let anchorX, anchorY;
      if (dir === 't') {
        anchorX = appCX;  anchorY = appCY + s.h / 2 + P;
      } else if (dir === 'b') {
        anchorX = appCX;  anchorY = appCY - s.h / 2 - P;
      } else if (dir === 'l') {
        anchorX = appCX + s.w / 2 + P;  anchorY = appCY;
      } else if (dir === 'r') {
        anchorX = appCX - s.w / 2 - P;  anchorY = appCY;
      } else {
        anchorX = appCX + ((dir === 'tl' || dir === 'bl') ? (s.w / 2 + P) : -(s.w / 2 + P));
        anchorY = appCY + ((dir === 'tl' || dir === 'tr') ? (s.h / 2 + P) : -(s.h / 2 + P));
      }
      stickerDragState = { type: 'resize', dir, anchorX, anchorY, origAspect: s.w / s.h, isShape: s.isShape, fixedCX: appCX, fixedCY: appCY };
    } else if (canvasSel) {
      // Canvas selection resize — anchor = opposite corner/edge in app coords
      let anchorX, anchorY;
      if (dir === 't')       { anchorX = ox + canvasSel.x; anchorY = oy + canvasSel.y + canvasSel.h; }
      else if (dir === 'b')  { anchorX = ox + canvasSel.x; anchorY = oy + canvasSel.y; }
      else if (dir === 'l')  { anchorX = ox + canvasSel.x + canvasSel.w; anchorY = oy + canvasSel.y; }
      else if (dir === 'r')  { anchorX = ox + canvasSel.x; anchorY = oy + canvasSel.y; }
      else {
        anchorX = ox + canvasSel.x + ((dir === 'tl' || dir === 'bl') ? canvasSel.w : 0);
        anchorY = oy + canvasSel.y + ((dir === 'tl' || dir === 'tr') ? canvasSel.h : 0);
      }
      canvasSelDragState = { type: 'resize', dir, anchorX, anchorY };
    }
  });
});

// Sticker + canvas selection move / resize mousemove
document.addEventListener('mousemove', (e) => {
  // Canvas selection drag (rubberband / move / resize)
  if (canvasSelDragState) {
    const layerRect = stickerLayer.getBoundingClientRect();
    const appEl  = document.querySelector('.app');
    const appRect = appEl.getBoundingClientRect();
    const ox = layerRect.left - appRect.left;
    const oy = layerRect.top  - appRect.top;

    if (canvasSelDragState.type === 'move' && canvasSel) {
      const dx = e.clientX - canvasSelDragState.startMouseX;
      const dy = e.clientY - canvasSelDragState.startMouseY;
      canvasSel.x = Math.max(0, Math.min(layerRect.width  - canvasSel.w, canvasSelDragState.startX + dx));
      canvasSel.y = Math.max(0, Math.min(layerRect.height - canvasSel.h, canvasSelDragState.startY + dy));
      updateCanvasSelEl();
      positionSelFrame();

    } else if (canvasSelDragState.type === 'resize' && canvasSel) {
      const { anchorX, anchorY, dir: rdir } = canvasSelDragState;
      const mouseX = e.clientX - appRect.left;
      const mouseY = e.clientY - appRect.top;
      if (rdir === 't' || rdir === 'b') {
        canvasSel.y = Math.max(0, Math.min(mouseY, anchorY) - oy);
        canvasSel.h = Math.max(10, Math.abs(mouseY - anchorY));
      } else if (rdir === 'l' || rdir === 'r') {
        canvasSel.x = Math.max(0, Math.min(mouseX, anchorX) - ox);
        canvasSel.w = Math.max(10, Math.abs(mouseX - anchorX));
      } else {
        canvasSel.x = Math.max(0, Math.min(mouseX, anchorX) - ox);
        canvasSel.y = Math.max(0, Math.min(mouseY, anchorY) - oy);
        canvasSel.w = Math.max(10, Math.abs(mouseX - anchorX));
        canvasSel.h = Math.max(10, Math.abs(mouseY - anchorY));
      }
      updateCanvasSelEl();
      positionSelFrame();
    }
  }

  if (!stickerDragState || !selectedSticker) return;
  const s = selectedSticker;

  if (stickerDragState.type === 'move') {
    const dx = e.clientX - stickerDragState.startMouseX;
    const dy = e.clientY - stickerDragState.startMouseY;
    const layerRect = stickerLayer.getBoundingClientRect();
    s.cx = Math.max(s.w / 2, Math.min(layerRect.width  - s.w / 2, stickerDragState.startCX + dx));
    s.cy = Math.max(s.h / 2, Math.min(layerRect.height - s.h / 2, stickerDragState.startCY + dy));
    s.el.style.left = s.cx + 'px';
    s.el.style.top  = s.cy + 'px';
    positionSelectFrame();

  } else if (stickerDragState.type === 'resize') {
    const { anchorX, anchorY, origAspect, dir, isShape: resizingShape, fixedCX, fixedCY } = stickerDragState;
    const appEl    = document.querySelector('.app');
    const appRect   = appEl.getBoundingClientRect();
    const layerRect = stickerLayer.getBoundingClientRect();
    const P = SF_INSET;

    const mouseX = e.clientX - appRect.left;
    const mouseY = e.clientY - appRect.top;

    let newW, newH, newCXapp, newCYapp;
    const isEdge = dir === 't' || dir === 'b' || dir === 'l' || dir === 'r';

    if (isEdge) {
      if (dir === 't' || dir === 'b') {
        const rawH = Math.abs(mouseY - anchorY);
        const frameH = Math.max(MIN_STICKER_PX + 2 * P, rawH);
        newH = frameH - 2 * P;
        newW = resizingShape ? s.w : newH * origAspect;
        const signY = (dir === 't') ? -1 : 1;
        newCYapp = anchorY + signY * frameH / 2;
        newCXapp = fixedCX;
      } else {
        const rawW = Math.abs(mouseX - anchorX);
        const frameW = Math.max(MIN_STICKER_PX + 2 * P, rawW);
        newW = frameW - 2 * P;
        newH = resizingShape ? s.h : newW / origAspect;
        const signX = (dir === 'l') ? -1 : 1;
        newCXapp = anchorX + signX * frameW / 2;
        newCYapp = fixedCY;
      }
    } else {
      // Corner handles — anchor includes P so rawW/H span the full frame
      const rawW = Math.abs(mouseX - anchorX);
      const rawH = Math.abs(mouseY - anchorY);
      const signX = (dir === 'tl' || dir === 'bl') ? -1 : 1;
      const signY = (dir === 'tl' || dir === 'tr') ? -1 : 1;
      if (resizingShape) {
        const frameW = Math.max(MIN_STICKER_PX + 2 * P, rawW);
        const frameH = Math.max(MIN_STICKER_PX + 2 * P, rawH);
        newW = frameW - 2 * P;
        newH = frameH - 2 * P;
        newCXapp = anchorX + signX * frameW / 2;
        newCYapp = anchorY + signY * frameH / 2;
      } else {
        // Stickers: maintain aspect ratio
        const innerW = Math.max(0, rawW - 2 * P);
        const innerH = Math.max(0, rawH - 2 * P);
        if (innerW > innerH * origAspect) {
          newW = Math.max(MIN_STICKER_PX, innerW);
          newH = newW / origAspect;
        } else {
          newH = Math.max(MIN_STICKER_PX, innerH);
          newW = newH * origAspect;
        }
        const frameW = newW + 2 * P;
        const frameH = newH + 2 * P;
        newCXapp = anchorX + signX * frameW / 2;
        newCYapp = anchorY + signY * frameH / 2;
      }
    }

    s.w  = newW;
    s.h  = newH;
    s.cx = newCXapp - (layerRect.left - appRect.left);
    s.cy = newCYapp - (layerRect.top  - appRect.top);
    s.el.style.width  = newW + 'px';
    s.el.style.height = newH + 'px';
    s.el.style.left   = s.cx + 'px';
    s.el.style.top    = s.cy + 'px';
    positionSelectFrame();
  }
});

document.addEventListener('mouseup', (e) => {
  if (stickerDragState) {
    if (stickerDragState.type === 'resize' && selectedSticker?.text) refreshTextSticker(selectedSticker);
    if (selectedSticker) selectedSticker.el.classList.remove('dragging');
    stickerDragState = null;
  }
  if (canvasSelDragState) {
    canvasSelDragState = null;
  }
});

// Click on empty layer area → select stroke or bucket fill
stickerLayer.addEventListener('mousedown', (e) => {
  if (e.target !== stickerLayer) return;

  if (currentTool === 'bucket') {
    if (currentColor) floodFill(getCanvasPos(e));
    return;
  }

  if (currentTool !== 'select') return;
  deselectSticker();

  const layerRect = stickerLayer.getBoundingClientRect();
  const clickX = e.clientX - layerRect.left;
  const clickY = e.clientY - layerRect.top;
  const dpr = window.devicePixelRatio || 1;
  const canvasX = Math.round(clickX * dpr);
  const canvasY = Math.round(clickY * dpr);

  if (canvasX < 0 || canvasX >= rawCanvas.width || canvasY < 0 || canvasY >= rawCanvas.height) {
    if (canvasSel) commitCanvasSel();
    return;
  }

  // Find the topmost stroke under the click (newest = last in list)
  let foundIdx = -1;
  for (let i = strokeList.length - 1; i >= 0; i--) {
    const px = strokeList[i].canvas.getContext('2d').getImageData(canvasX, canvasY, 1, 1).data;
    if (px[3] > 20) { foundIdx = i; break; }
  }

  if (foundIdx >= 0) {
    if (canvasSel) commitCanvasSel();
    saveCanvasState(); // snapshot BEFORE lifting, so undo restores the piece
    const stroke = strokeList.splice(foundIdx, 1)[0]; // remove from list
    buildRawCanvas(); // rebuild display without this stroke
    const bbox = strokeBBox(stroke.canvas);
    if (bbox) {
      canvasSelInner.width  = bbox.w;
      canvasSelInner.height = bbox.h;
      const tc = canvasSelInner.getContext('2d');
      tc.clearRect(0, 0, bbox.w, bbox.h);
      tc.drawImage(stroke.canvas, bbox.x, bbox.y, bbox.w, bbox.h, 0, 0, bbox.w, bbox.h);
      canvasSel = { x: bbox.x / dpr, y: bbox.y / dpr, w: bbox.w / dpr, h: bbox.h / dpr };
      canvasSel.staticInfo = stroke.isStatic ? { color: stroke.color } : null;
      canvasSel.fromSticker = !!stroke.isSticker;
      stickerLayer.appendChild(canvasSelContent); // bring to DOM front (above all stickers)
      updateCanvasSelEl();
      positionSelFrame();
    } else {
      strokeList.splice(foundIdx, 0, stroke); // empty stroke — put it back
    }
  } else {
    if (canvasSel) commitCanvasSel();
  }
});

// Flood-fill bounding box of connected painted region
function connectedBBox(data, width, height, startX, startY) {
  const visited = new Uint8Array(width * height);
  const stack = [startY * width + startX];
  let minX = startX, minY = startY, maxX = startX, maxY = startY;
  while (stack.length > 0) {
    const i = stack.pop();
    if (visited[i]) continue;
    visited[i] = 1;
    const x = i % width;
    const y = (i / width) | 0;
    if (data[i * 4 + 3] <= 20) continue;
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
    if (x > 0)         stack.push(i - 1);
    if (x < width - 1) stack.push(i + 1);
    if (y > 0)         stack.push(i - width);
    if (y < height - 1) stack.push(i + width);
  }
  const pad = 4;
  return {
    x: Math.max(0, minX - pad),
    y: Math.max(0, minY - pad),
    w: Math.min(width,  maxX + pad) - Math.max(0, minX - pad),
    h: Math.min(height, maxY + pad) - Math.max(0, minY - pad),
  };
}

// ===== Stroke canvas helpers =====

// Snapshot rawCanvas into a single stroke entry
function makeStrokeFromRaw() {
  const sc = document.createElement('canvas');
  sc.width = rawCanvas.width;
  sc.height = rawCanvas.height;
  sc.getContext('2d').drawImage(rawCanvas, 0, 0);
  return { id: ++strokeIdCounter, canvas: sc };
}

// Rebuild rawCanvas from all stroke canvases (pixel-perfect composite)
function buildRawCanvas() {
  rawCtx.save();
  rawCtx.setTransform(1, 0, 0, 1, 0, 0);
  rawCtx.clearRect(0, 0, rawCanvas.width, rawCanvas.height);
  for (const stroke of strokeList) {
    rawCtx.drawImage(stroke.canvas, 0, 0);
  }
  rawCtx.restore();
  renderStyledCanvas();
}

// Compute bounding box of non-transparent pixels in a stroke canvas (device pixels)
function strokeBBox(strokeCanvas) {
  const w = strokeCanvas.width, h = strokeCanvas.height;
  const data = strokeCanvas.getContext('2d').getImageData(0, 0, w, h).data;
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (data[(y * w + x) * 4 + 3] > 20) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return null;
  const pad = 4;
  return {
    x: Math.max(0, minX - pad),
    y: Math.max(0, minY - pad),
    w: Math.min(w, maxX + pad + 1) - Math.max(0, minX - pad),
    h: Math.min(h, maxY + pad + 1) - Math.max(0, minY - pad),
  };
}

// Populate sticker picker grid
STICKERS_LIST.forEach((name) => {
  const thumb = document.createElement('img');
  thumb.className = 'sticker-thumb';
  thumb.src = `stickers/${name}.webp?v=2`;
  thumb.alt = name.replace(/-/g, ' ');
  thumb.draggable = false;
  thumb.addEventListener('click', () => {
    const layerRect = stickerLayer.getBoundingClientRect();
    const cx = layerRect.width  / 2;
    const cy = layerRect.height / 2;
    // Size to at most 150px on the longest side
    const nw = thumb.naturalWidth  || 120;
    const nh = thumb.naturalHeight || 120;
    const scale = Math.min(150 / nw, 150 / nh);
    saveCanvasState();
    const sticker = addSticker(`stickers/${name}.webp?v=2`, cx, cy, nw * scale, nh * scale);
    stickerPanel.classList.remove('open');
    setActiveTool('select');
    selectStickerEl(sticker);
  });
  stickerGrid.appendChild(thumb);
});

// ===== Shape System =====
const SHAPES_LIST = [
  'circle', 'hexagon', 'square', 'triangle',
  'star-4pt', 'hexagon-round', 'square-round', 'triangle-right',
  'sparkle-big', 'star-5pt', 'heart', 'sparkle-4pt',
  'arrow-undo', 'arrow-redo', 'arrow-left', 'arrow-double',
  'pin', 'camera', 'pen-nib', 'speech-bubble',
];

const shapePanel = document.getElementById('shapePanel');
const shapeGrid  = document.getElementById('shapeGrid');

SHAPES_LIST.forEach((name) => {
  const thumb = document.createElement('img');
  thumb.className = 'sticker-thumb';
  thumb.src = `shapes/${name}.webp?v=2`;
  thumb.alt = name.replace(/-/g, ' ');
  thumb.draggable = false;
  thumb.addEventListener('click', () => {
    const layerRect = stickerLayer.getBoundingClientRect();
    const cx = layerRect.width  / 2;
    const cy = layerRect.height / 2;
    const nw = thumb.naturalWidth  || 120;
    const nh = thumb.naturalHeight || 120;
    const scale = Math.min(150 / nw, 150 / nh);
    saveCanvasState();
    const sticker = addSticker(`shapes/${name}.webp?v=2`, cx, cy, nw * scale, nh * scale, true);
    shapePanel.classList.remove('open');
    setActiveTool('select');
    selectStickerEl(sticker);
  });
  shapeGrid.appendChild(thumb);
});

// ===== Text Tool =====
const FONTS = [
  { name: 'Handwriting', family: 'Handwriting' },
  { name: 'Bubble',      family: 'Bubble' },
  { name: 'Blocky',      family: 'Blocky' },
  { name: 'Bubble I',    family: 'Bubble I' },
  { name: 'Rough',       family: 'Rough' },
  { name: 'Strokes',     family: 'Strokes' },
];
let currentTextFont = FONTS[0].family;
let textInputActive = false;
let textClickPos = null;

// Text input frame — drawn in code (like the select frame), no PNG padding
const TEXT_INNER_W = 200; // visible frame width
const TEXT_INNER_H = 105; // visible frame height
const TEXT_BTN_GAP = 10;  // gap between the frame and the tick/cross row
const TEXT_FONT_SIZE = 24; // px in the textarea

// Populate font picker panel
const fontGrid = document.getElementById('fontGrid');
FONTS.forEach((font, idx) => {
  const thumb = document.createElement('div');
  thumb.className = 'font-thumb' + (idx === 0 ? ' selected' : '');
  thumb.textContent = 'Aa';
  thumb.style.fontFamily = `'${font.family}', cursive`;
  thumb.dataset.family = font.family;
  thumb.addEventListener('click', () => {
    currentTextFont = font.family;
    fontGrid.querySelectorAll('.font-thumb').forEach((t) => t.classList.remove('selected'));
    thumb.classList.add('selected');
    document.getElementById('typePanel').classList.remove('open');
    document.querySelector('[data-tool="type"]').classList.add('active');
    if (textInputActive) textInputArea.style.fontFamily = `'${currentTextFont}', cursive`;
  });
  fontGrid.appendChild(thumb);
});

const textInputBox  = document.getElementById('textInputBox');
// Decorate the code-drawn text frame with the little squares
{
  const tf = textInputBox.querySelector('.text-frame-bg');
  [['0%','0%'],['50%','0%'],['100%','0%'],['0%','50%'],['100%','50%'],['0%','100%'],['50%','100%'],['100%','100%']]
    .forEach(([hx, hy]) => {
      const sq = document.createElement('span');
      sq.className = 'tfh';
      sq.style.left = hx;
      sq.style.top  = hy;
      tf.appendChild(sq);
    });
}
const textInputArea = document.getElementById('textInputArea');

function showTextBox(clientX, clientY) {
  const appEl    = document.querySelector('.app');
  const appRect  = appEl.getBoundingClientRect();
  const canvasRect = canvas.getBoundingClientRect();

  const boxW = TEXT_INNER_W;
  const boxH = TEXT_INNER_H + TEXT_BTN_GAP + 52; // frame + gap + button row

  let left = (clientX - appRect.left) - boxW / 2;
  let top  = (clientY - appRect.top)  - boxH / 2;

  // Clamp so the box stays within the canvas drawing area
  const cleft   = canvasRect.left   - appRect.left;
  const ctop    = canvasRect.top    - appRect.top;
  const cright  = cleft + canvasRect.width;
  const cbottom = ctop  + canvasRect.height;
  left = Math.max(cleft, Math.min(cright  - boxW, left));
  top  = Math.max(ctop,  Math.min(cbottom - boxH, top));

  textInputBox.style.left   = left + 'px';
  textInputBox.style.top    = top  + 'px';
  textInputBox.style.width  = boxW + 'px';
  textInputBox.style.height = 'auto';

  // Size the code-drawn frame to the visible box exactly
  const frameEl = textInputBox.querySelector('.text-frame-bg');
  frameEl.style.width  = TEXT_INNER_W + 'px';
  frameEl.style.height = TEXT_INNER_H + 'px';

  // Position textarea in the frame's inner area
  textInputArea.style.left       = '8px';
  textInputArea.style.top        = '6px';
  textInputArea.style.width      = (TEXT_INNER_W - 16) + 'px';
  textInputArea.style.height     = (TEXT_INNER_H - 12) + 'px';
  textInputArea.style.fontFamily = `'${currentTextFont}', cursive`;
  textInputArea.style.fontSize   = TEXT_FONT_SIZE + 'px';
  textInputArea.style.color      = currentColor || '#555555';
  textInputArea.value = '';

  // Position button row just below the frame
  const btnRow = textInputBox.querySelector('.text-btn-row');
  btnRow.style.top   = (TEXT_INNER_H + TEXT_BTN_GAP) + 'px';
  btnRow.style.left  = '0';
  btnRow.style.width = boxW + 'px';

  textInputBox.style.display = 'block';
  textInputActive = true;

  // Remember canvas-relative click position (CSS px) for text rendering
  textClickPos = { x: clientX - canvasRect.left, y: clientY - canvasRect.top };

  setTimeout(() => textInputArea.focus(), 30);
}

function hideTextBox() {
  textInputBox.style.display = 'none';
  textInputActive = false;
  textClickPos = null;
  textInputArea.value = '';
}

// Render text to a tightly-cropped PNG. `scale` = image pixels per CSS pixel at base size.
// Returns { url, w, h } where w/h are the CSS size at 1× (i.e. before any user resizing).
function renderTextImage(t, scale) {
  const fontSize = t.base * scale;
  const lines  = t.text.split('\n');
  const lineH  = fontSize * 1.35;
  const PAD    = 8 * scale;
  const tmpCtx = document.createElement('canvas').getContext('2d');
  tmpCtx.font  = `${fontSize}px '${t.font}', cursive`;
  const maxW   = Math.max(...lines.map((l) => tmpCtx.measureText(l).width), 1);

  const sc   = document.createElement('canvas');
  sc.width   = Math.ceil(maxW + 2 * PAD);
  sc.height  = Math.ceil(lines.length * lineH + 2 * PAD);
  const sCtx = sc.getContext('2d');
  sCtx.font         = `${fontSize}px '${t.font}', cursive`;
  sCtx.fillStyle    = t.color;
  sCtx.textBaseline = 'top';
  lines.forEach((line, i) => sCtx.fillText(line, PAD, PAD + i * lineH));

  const bbox = strokeBBox(sc);
  if (!bbox) return null;
  const cropped = document.createElement('canvas');
  cropped.width  = bbox.w;
  cropped.height = bbox.h;
  cropped.getContext('2d').drawImage(sc, bbox.x, bbox.y, bbox.w, bbox.h, 0, 0, bbox.w, bbox.h);
  return { url: cropped.toDataURL('image/png'), w: bbox.w / scale, h: bbox.h / scale };
}

// Re-render a text sticker at a resolution that matches its current on-screen size,
// so it stays sharp however large it's made. Also used to recolour it.
const MAX_TEXT_PX = 6000;
function refreshTextSticker(sticker, force = false) {
  const t = sticker.text;
  if (!t) return;
  const dpr = window.devicePixelRatio || 1;
  let scale = Math.max(4, Math.ceil((sticker.w / t.baseW) * dpr * 1.5));
  scale = Math.min(scale, Math.max(1, Math.floor(MAX_TEXT_PX / t.baseW)));
  if (!force && scale <= t.scale) return; // already sharp enough
  const r = renderTextImage(t, scale);
  if (!r) return;
  t.scale = scale;
  const img = sticker.el.querySelector('img');
  img.src = r.url;
  sticker.src = r.url;
}

function commitText() {
  const rawText = textInputArea.value;
  if (!rawText.trim()) { hideTextBox(); return; }

  // Capture values before hideTextBox clears them
  const textColor  = currentColor || '#555555';
  const fontFamily = currentTextFont;
  const clickPos   = textClickPos;
  const bSize      = brushSize;
  hideTextBox(); // clear immediately — prevents re-entry when setActiveTool is called below

  const base = Math.max(16, bSize * 3); // CSS font size at 1× scale
  const r = renderTextImage({ text: rawText, font: fontFamily, color: textColor, base }, 4);
  if (!r) return;
  const rect = canvas.getBoundingClientRect();
  const sCX = clickPos ? clickPos.x : rect.width  / 2;
  const sCY = clickPos ? clickPos.y : rect.height / 2;

  saveCanvasState();
  const sticker = addSticker(r.url, sCX, sCY, r.w, r.h, false);
  sticker.text = { text: rawText, font: fontFamily, color: textColor, base, baseW: r.w, scale: 4 };
  setActiveTool('select');
  selectStickerEl(sticker);
}

document.getElementById('textOkBtn').addEventListener('click', commitText);
document.getElementById('textCancelBtn').addEventListener('click', hideTextBox);

textInputArea.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitText(); }
  if (e.key === 'Escape') { hideTextBox(); }
});

// Show text box on canvas click while type tool is active
canvas.addEventListener('mousedown', (e) => {
  if (currentTool !== 'type') return;
  if (textInputActive) { commitText(); return; }
  showTextBox(e.clientX, e.clientY);
}, true); // capture phase so it runs before startDrawing

// ===== Init =====
applyTheme(); // Set initial theme (initializes activeColor on swatches)
initCanvas();

// Auto-select the first swatch so the brush is ready to paint immediately
document.querySelectorAll('.swatch')[0].click();

// Handle resize - preserve drawing
let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(initCanvas, 100);
});

  </script>
